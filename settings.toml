# =============================================================================
# ssh_registry settings
#
# Where the host data lives, where the generated ssh config goes, and WHO logs
# in. The JSONL in S3 holds servers only - no users - so the same files serve
# every person. Keys are not managed here at all: ssh uses its defaults
# (~/.ssh/id_ed25519, ...) and the agent; anything else is your own business.
#
# Per-user overrides: copy any section to ~/.config/ssh_registry/settings.toml.
# Values there win over this file, key by key. `~` expands to the user's home.
# =============================================================================

[source]
# Host data: one JSONL file per module (cw_alchmy.jsonl, cw_github.jsonl, ...).
# The bucket blocks public access, so this is read with the AWS CLI using the
# caller's own credentials, never over plain https.
bucket = "thanudev12"
region = "us-east-2"
prefix = "shellrc/ssh_registry/"

[cache]
# Last good copy of the JSONL. Used when S3 is unreachable, so a network blip
# never leaves you without an ssh config.
dir = "~/.cache/ssh_registry"

[output]
# The generated config. ~/.ssh/config Includes it; never edit it by hand.
config = "~/.ssh/ssh_registry.config"

# --- who logs in ------------------------------------------------------------
# Most specific wins: [hosts."<name>"] > [modules.<module>] > [identity].

[identity]
# Your corporate login - the default for every host. Leave empty here and set
# it in ~/.config/ssh_registry/settings.toml, because this file is shared.
user = ""

[modules.cw_github]
user = "git"

[modules.cw_gitlab]
user = "git"

[hosts."dev-alchmy"]
user = "ec2-user"

# --- defaults for every host (written as `Host *`, last) ---------------------
[ssh_defaults]
ServerAliveInterval = "60"
ServerAliveCountMax = "3"
TCPKeepAlive = "yes"
Compression = "yes"
AddKeysToAgent = "yes"
