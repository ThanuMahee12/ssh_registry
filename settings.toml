# =============================================================================
# ssh_registry settings
#
# Where the host data lives and where the generated ssh config goes. The JSONL
# in S3 holds servers only - no users, no keys - so the same files serve every
# person. Each user's login and key live in their own ~/.shellrc/cred.toml,
# written by `shellrc config`.
#
# Per-user overrides: copy any section to ~/.config/ssh_registry/settings.toml.
# Values there win over this file, key by key. `~` expands to the user's home.
# =============================================================================

[source]
# Host data: one JSONL file per module (cw_alchmy.jsonl, cw_github.jsonl, ...).
# The bucket blocks public access, so this is read with the AWS CLI using the
# caller's own credentials, never over plain https.
bucket = "thanudev12"
region = "us-east-2"
prefix = "shellrc/ssh_registry/"

[cache]
# Last good copy of the JSONL. Used when S3 is unreachable, so a network blip
# never leaves you without an ssh config.
dir = "~/.cache/ssh_registry"

[output]
# The generated config. ~/.ssh/config Includes it; never edit it by hand.
config = "~/.ssh/ssh_registry.config"

[credentials]
# Per-user login and key choices; `shellrc config` writes it (0600).
file = "~/.shellrc/cred.toml"

# --- who logs in -------------------------------------------------------------
# Most specific wins:
#   [hosts."<name>"] below  >  cred.toml [<module>]  >  [modules.<module>] below
#   >  cred.toml [global]
# A [hosts] entry is a fact about one box (dev-alchmy only accepts ec2-user),
# so nothing overrides it. A [modules] entry is a sensible default (git hosts
# log in as `git`) that your own cred.toml [<module>] may still change.
# Keys come only from cred.toml, as a file path: [<module>] key, else [global].

[modules.cw_github]
user = "git"

[modules.cw_gitlab]
user = "git"

[hosts."dev-alchmy"]
user = "ec2-user"

# --- defaults for every host (written as `Host *`, last) ---------------------
[ssh_defaults]
ServerAliveInterval = "60"
ServerAliveCountMax = "3"
TCPKeepAlive = "yes"
Compression = "yes"
AddKeysToAgent = "yes"
